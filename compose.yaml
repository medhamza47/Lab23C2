x-mysql: &mysql
  image: mysql:8.4
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        mysql -h 127.0.0.1 -u lab -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
    interval: 5s
    timeout: 5s
    retries: 20

services:
  consul:
    image: hashicorp/consul:1.20.5
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12

  mysql-client:
    <<: *mysql
    environment:
      MYSQL_DATABASE: Micro_ClientDB
      MYSQL_USER: lab
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD:-lab-db-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - client-data:/var/lib/mysql

  mysql-car:
    <<: *mysql
    environment:
      MYSQL_DATABASE: carservicedb
      MYSQL_USER: lab
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD:-lab-db-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - car-data:/var/lib/mysql

  client:
    build:
      context: .
      args:
        MODULE: client
    environment:
      CONSUL_HOST: consul
      DB_URL: jdbc:mysql://mysql-client:3306/Micro_ClientDB?allowPublicKeyRetrieval=true
      DB_USER: lab
      DB_PASSWORD: ${LAB_DB_PASSWORD:-lab-db-password}
    depends_on:
      consul:
        condition: service_healthy
      mysql-client:
        condition: service_healthy

  car:
    build:
      context: .
      args:
        MODULE: car
    environment:
      CONSUL_HOST: consul
      DB_URL: jdbc:mysql://mysql-car:3306/carservicedb?allowPublicKeyRetrieval=true
      DB_USER: lab
      DB_PASSWORD: ${LAB_DB_PASSWORD:-lab-db-password}
    depends_on:
      consul:
        condition: service_healthy
      mysql-car:
        condition: service_healthy

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      CONSUL_HOST: consul
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      consul:
        condition: service_healthy

volumes:
  client-data:
  car-data:
