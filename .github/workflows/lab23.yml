name: Validation du TP 23

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  consul:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer les services
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait
      - name: Vérifier le catalogue Consul et les routes
        run: |
          for service in SERVICE-CLIENT SERVICE-CAR SERVICE-GATEWAY; do
            url="http://localhost:8500/v1/health/service/$service?passing=true"
            for attempt in {1..30}; do
              if curl -fsS "$url" | jq -e 'length == 1' >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -fsS "$url" | jq -e '
              select(length == 1) |
              .[0] | {service: .Service.Service, adresse: .Service.Address,
                      port: .Service.Port, checks: [.Checks[].Status]}'
          done
          curl -fsS --retry 8 --retry-all-errors --retry-delay 2 \
            http://localhost:8888/SERVICE-CLIENT/api/client | jq -e 'length >= 3'
          curl -fsS --retry 8 --retry-all-errors --retry-delay 2 \
            http://localhost:8888/SERVICE-CAR/api/car | jq -e 'type == "array"'
      - name: Afficher les journaux en cas d’échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêter les conteneurs
        if: always()
        run: docker compose down --volumes
